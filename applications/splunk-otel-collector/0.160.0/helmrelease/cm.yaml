apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-config-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    # Splunk OpenTelemetry Collector for Kubernetes — portable defaults.
    #
    # EDIT-ME at deploy time (Kommander UI override, or here):
    #   * clusterName                     -> the NKP/Kommander cluster name (required, non-empty)
    #   * splunkPlatform.endpoint         -> https://<stack>.splunkcloud.com:8088/services/collector/event
    #   * splunkPlatform.index            -> an index ALLOWED by the HEC token (Splunk Cloud:
    #                                        Settings > Data inputs > HTTP Event Collector > token,
    #                                        "Selected Allowed Indexes"). An unallowed index returns
    #                                        HTTP 400 "Incorrect index" and the collector SILENTLY
    #                                        drops every event (pods still look Ready).
    #   * the HEC token                   -> prefer a Secret <releaseName>-hec (key: token);
    #                                        otherwise set splunkPlatform.token below.
    #
    # TLS: the Splunk Cloud HEC endpoint serves CN=SplunkServerDefaultCert (issuer SplunkCommonCA),
    # which is NOT publicly trusted, so insecureSkipVerify must stay true unless you trust that CA.

    # NOTE: the chart's values.schema.json requires clusterName and splunkPlatform.token to be
    # NON-EMPTY, so these are explicit placeholders — you MUST override them (or supply the
    # <releaseName>-hec Secret for the token) before real traffic flows.

    clusterName: "EDIT-ME-CLUSTER-NAME"

    splunkPlatform:
      endpoint: "https://CHANGEME.splunkcloud.com:8088/services/collector/event"
      token: "EDIT-ME-HEC-TOKEN"
      index: "main"
      metricsIndex: ""
      source: kubernetes
      logsEnabled: true
      metricsEnabled: false
      tracesEnabled: false
      insecureSkipVerify: true

    # Log parity with NKP's two Fluent Bits:
    #   * container logs  = the chart's default container collection
    #   * host logs       = ONE catch-all journald receiver (all units + kernel), configured
    #                       under agent.config below, instead of the chart's narrow 5-unit list.
    #     (NKP's host Fluent Bit reads the whole journal AND /dev/kmsg, so a unit-filtered
    #      receiver would silently miss most host services and all kernel messages.)
    logsCollection:
      containers:
        enabled: true
      # journald.units is intentionally EMPTY: it is replaced by the catch-all journald/all
      # receiver in agent.config. The chart only generates one receiver per listed unit and
      # has no "all units" mode.
      journald:
        enabled: true
        directory: /var/log/journal
        units: []
      extraFileLogs:
        # NOTE: the chart renamed the filelog receiver to `file_log`; the key IS the receiver
        # name, so it must be `file_log/...` (a legacy `filelog/...` key still works but the
        # chart's validator rejects that name in agent.config overrides).
        file_log/nkp-audit:
          include:
            - /var/log/kubernetes/audit/*.log
          start_at: end
          include_file_path: true
          include_file_name: false
          resource:
            com.splunk.source: /var/log/kubernetes/audit
            com.splunk.sourcetype: kube:apiserver-audit
            host.name: 'EXPR(env("K8S_NODE_NAME"))'

    agent:
      enabled: true
      # Full host-log parity: a single journald receiver with NO units/identifiers/matches
      # filter reads the entire journal (systemd units + kernel via _TRANSPORT=kernel).
      # Sourcetypes: kube:journald:<unit> for units, kube:kernel for kernel messages.
      config:
        receivers:
          # kubelet (cAdvisor) metrics are pulled from https://${K8S_NODE_IP}:10250.
          # The kubelet serving certificate usually has no IP SAN, so default CA
          # verification fails ("x509: cannot validate certificate ... doesn't contain
          # any IP SANs") and the receiver silently scrapes NOTHING (0 points, no drops).
          # insecure_skip_verify is the documented fix; use ca_file instead if you
          # prefer to trust the kubelet CA.
          kubelet_stats:
            insecure_skip_verify: true
          journald/all:
            directory: /var/log/journal
            priority: info
            retry_on_failure:
              enabled: true
            storage: file_storage
            operators:
              - type: add
                field: resource["com.splunk.source"]
                value: /var/log/journal
              - type: add
                field: resource["com.splunk.sourcetype"]
                value: 'EXPR("kube:journald:"+body._SYSTEMD_UNIT)'
                if: 'body._SYSTEMD_UNIT != nil'
              - type: add
                field: resource["com.splunk.sourcetype"]
                value: kube:kernel
                if: 'body._SYSTEMD_UNIT == nil'
              - type: add
                field: resource["com.splunk.index"]
                value: k8s_logs
              - type: add
                field: resource["host.name"]
                value: 'EXPR(env("K8S_NODE_NAME"))'
              - type: add
                field: resource["journald.priority.number"]
                value: 'EXPR(body.PRIORITY)'
              - type: add
                field: resource["journald.unit.name"]
                value: 'EXPR(body._SYSTEMD_UNIT)'
              - type: move
                id: set-body
                from: body.MESSAGE
                to: body
        service:
          pipelines:
            # Redefine the list to attach the catch-all journald receiver (lists are replaced,
            # not merged, so the audit receiver must be listed explicitly).
            logs/host:
              receivers:
                - file_log/nkp-audit
                - journald/all
      # Mount the NKP kube-apiserver audit directory (DirectoryOrCreate avoids errors on workers).
      extraVolumes:
        - name: nkp-audit
          hostPath:
            path: /var/log/kubernetes/audit
            type: DirectoryOrCreate
      extraVolumeMounts:
        - name: nkp-audit
          mountPath: /var/log/kubernetes/audit
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 512Mi

    # Cluster receiver is only needed for Kubernetes metrics/events.
    # Set clusterReceiver.enabled: true together with splunkPlatform.metricsEnabled: true.
    clusterReceiver:
      enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 500Mi
