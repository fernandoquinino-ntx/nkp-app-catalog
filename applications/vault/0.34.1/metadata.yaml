description: |
  HashiCorp Vault secures, stores, and tightly controls access to tokens, passwords,
  certificates, API keys, and other secrets. Deployed here in HA Raft mode with the UI
  enabled, it provides encryption as a service, dynamic secrets, PKI, and audit logging.
dependencies: []
# base64-encoded SVG (simple-icons vault) — the NKP schema documents `icon` as base64 SVG
icon: ""
licensing:
  - Pro
  - Ultimate
overview: |
  **What it is** — Vault is a secrets-management and encryption platform that centralizes secrets,
  enforces fine-grained access policies, and produces audit logs for compliance.

  **Highlights**
  - **HA Raft** integrated storage (no external Consul/etcd required); Web UI enabled
  - Dynamic secrets for databases/clouds/APIs, encryption-as-a-service (transit), Kubernetes auth
  - PKI + ACME capable, audit logging, policy as code

  **Documentation:** [Vault docs](https://developer.hashicorp.com/vault/docs) | **Project:** [hashicorp/vault](https://github.com/hashicorp/vault)
